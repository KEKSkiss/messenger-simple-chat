<!DOCTYPE html>
<html>
<head lang="en">
    <meta charset="UTF-8">
    <title>Send a message</title>
    <style>
        .form {
            width: 100%;
            display: inline-block;
            border: 1px solid rgba(25, 25, 25, 0.32);
        }

        .messages {
            margin-bottom: 8px;
        }

        .message {
            color: red;
            border-radius: 4px;
            margin: 4px 0;
            padding: 4px;
        }

        input[type=submit] {
            visibility: collapse;
        }

        input {
            border: 0;
            outline: none;
            width: calc(100% - 2px);
        }
    </style>
</head>
<body>
    <form class="form" action="/">
        <div class="messages"></div>
        <input class="form-input" name="message-text" placeholder="Введите сообщение" type="text">
    </form>

    <script>
        const form = document.querySelector('form');
        const input = document.querySelector('.form-input');
        const messagesContainer = document.querySelector('.messages');

        // Загружаем сохранённые сообщения при открытии страницы
        let messages = JSON.parse(localStorage.getItem('messages')) || [];

        // Отрисовываем уже сохранённые сообщения
        messages.forEach(text => {
            addMessageToDOM(text);
        });

        form.addEventListener('submit', handleSubmit);

        function handleSubmit(event) {
            event.preventDefault();

            const text = input.value.trim();
            if (!text) return; // пустые сообщения не сохраняем

            // Добавляем в массив и сохраняем в localStorage
            messages.push(text);
            localStorage.setItem('messages', JSON.stringify(messages));

            // Добавляем сообщение на страницу
            addMessageToDOM(text);

            // Очищаем поле ввода
            input.value = '';
        }

        function addMessageToDOM(text) {
            const messageEl = document.createElement('div');
            messageEl.className = 'message';
            messageEl.innerText = text;
            messagesContainer.appendChild(messageEl);
        }
    </script>
</body>
</html>
